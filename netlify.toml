[build]
  publish = "."

# ─── Bloquer les fichiers internes du public ───
[[redirects]]
  from = "/internal/*"
  to = "/404"
  status = 404
  force = true

# ─── Redirections /liens ───
[[redirects]]
  from = "/liens"
  to = "/liens/index.html"
  status = 200

[[redirects]]
  from = "/liens/"
  to = "/liens/index.html"
  status = 200
