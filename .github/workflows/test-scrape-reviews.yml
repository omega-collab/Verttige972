name: Scrape Google Reviews (Playwright)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/scrape_google_reviews.py'
      - '.github/workflows/test-scrape-reviews.yml'

concurrency:
  group: scrape-reviews
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright==1.48.0
          playwright install --with-deps chromium

      - name: Run scraper (hard timeout 3min)
        id: scrape
        continue-on-error: true
        run: |
          set +e
          timeout 200 python3 scripts/scrape_google_reviews.py \
            > /tmp/reviews.json 2> /tmp/scraper.log
          echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Show logs
        if: always()
        run: |
          echo "─── scraper.log (dernières 120 lignes) ───"
          tail -120 /tmp/scraper.log || echo "(no log)"
          echo ""
          echo "─── reviews.json (500 chars) ───"
          head -c 500 /tmp/reviews.json 2>/dev/null || echo "(no output)"
          echo ""
          echo "─── /tmp/scraper-debug ───"
          ls -la /tmp/scraper-debug/ 2>/dev/null || echo "(no debug dir)"

      - name: Upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: |
            /tmp/reviews.json
            /tmp/scraper.log
            /tmp/scraper-debug/
          if-no-files-found: warn
          retention-days: 3
