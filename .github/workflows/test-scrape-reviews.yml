name: Scrape Google Reviews (Playwright)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/scrape_google_reviews.py'
      - '.github/workflows/test-scrape-reviews.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright==1.48.0
          playwright install --with-deps chromium

      - name: Run scraper
        id: scrape
        continue-on-error: true
        run: |
          echo "::group::Scraper stderr"
          python3 scripts/scrape_google_reviews.py > /tmp/reviews.json 2> /tmp/scraper.log
          echo "::endgroup::"

      - name: Show logs
        if: always()
        run: |
          echo "─── Scraper stderr ───"
          cat /tmp/scraper.log 2>&1 | tail -100 || true
          echo ""
          echo "─── Nb bytes reviews.json ───"
          wc -c /tmp/reviews.json 2>&1 || true
          echo ""
          echo "─── Contenu reviews.json (500 chars) ───"
          head -c 500 /tmp/reviews.json 2>&1 || true
          echo ""

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-google
          path: |
            /tmp/reviews.json
            /tmp/scraper.log
            /tmp/debug-google.png
            /tmp/debug-google.html
          if-no-files-found: warn
          retention-days: 3
